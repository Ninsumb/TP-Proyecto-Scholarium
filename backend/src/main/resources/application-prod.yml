# Perfil de producción.
# Solo sobrescribe lo que debe cambiar frente a application.yml (perfil default = desarrollo local).
# Spring mergea este archivo sobre application.yml cuando SPRING_PROFILES_ACTIVE=prod.

spring:
  datasource:
    hikari:
      minimum-idle: 0
      idle-timeout: 60000
      maximum-pool-size: 5
      max-lifetime: 300000
      connection-timeout: 30000
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

server:
  error:
    include-message: never

logging:
  level:
    root: WARN
