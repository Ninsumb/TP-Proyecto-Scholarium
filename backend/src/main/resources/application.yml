server:
  port: 9001
  error:
    whitelabel:
      enabled: false
    include-message: always
    include-stacktrace: never

spring:
  #   base de datos posta
  datasource:
    url: jdbc:postgresql://localhost:5433/scholarium
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect


